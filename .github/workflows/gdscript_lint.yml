name: gscript lint

on:
  pull_request:
    branches:  "master"

jobs:
  lint:
    name: Run gdlint & gdformat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install gdscript-toolkit
        run: |
          python -m pip install --upgrade pip
          pip install "gdtoolkit>=4.0.0"
      
      - name: Get .gd pr files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.gd

      - name: Run gdlint on pr
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          gdlint ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Auto-format GDScript files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          gdformat ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Commit formatted code
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-format GDScript with gdformat"
